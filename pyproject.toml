[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finplan-tui"
version = "0.1.0"
description = "Provider-neutral Textual financial planning interfaces and models"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["finplan_tui"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
